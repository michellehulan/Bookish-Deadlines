<style>
body {
  font-family: Arial, sans-serif;
  font-size: 16px;
  color: #003c69;

  display: flex;
  justify-content: center;
  align-items: center;

  height: 100vh;
  margin: 0;
  text-align: center;
}

#countdowns {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.count-num {
  color: #c00000;
  font-weight: bold;
}
</style>

<body>
  <div id="countdowns">
    <div id="courtney"></div>
    <div id="drew"></div>
    <div id="michelle"></div>
    <div id="nick"></div>
  </div>

<script>
function timeUntil(month, day) {
  const now = new Date();
  let year = now.getFullYear();

  let target = Date.UTC(year, month, day);

  if (now.getTime() > target) {
    target = Date.UTC(year + 1, month, day);
  }

  let diff = target - now.getTime();
  diff = Math.max(0, diff);

  const totalSeconds = Math.floor(diff / 1000);

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);

  return { days, hours, minutes };
}

function update() {

  // Courtney — June 1
  const courtney = timeUntil(5, 1);

  // Drew — March 15
  const drew = timeUntil(2, 15);

  // Michelle — March 1
  const michelle = timeUntil(2, 1);

  // Nick — February 28
  const nick = timeUntil(1, 28);

  document.getElementById("courtney").innerHTML =
    `<span class="count-num">${courtney.days}</span> days ` +
    `<span class="count-num">${courtney.hours}</span> hours ` +
    `<span class="count-num">${courtney.minutes}</span> minutes until Courtney completes her next complete draft of Bad Energy.`;

  document.getElementById("drew").innerHTML =
    `<span class="count-num">${drew.days}</span> days ` +
    `<span class="count-num">${drew.hours}</span> hours ` +
    `<span class="count-num">${drew.minutes}</span> minutes until Drew shares 50,000 words of his novel-in-progress.`;

  document.getElementById("michelle").innerHTML =
    `<span class="count-num">${michelle.days}</span> days ` +
    `<span class="count-num">${michelle.hours}</span> hours ` +
    `<span class="count-num">${michelle.minutes}</span> minutes until Michelle completes her first draft of Merel's story.`;

  document.getElementById("nick").innerHTML =
    `<span class="count-num">${nick.days}</span> days ` +
    `<span class="count-num">${nick.hours}</span> hours ` +
    `<span class="count-num">${nick.minutes}</span> minutes until Nick sends everyone his final version of The Complex.`;
}

update();
setInterval(update, 1000);
</script>
</body>
