<style>
body {
  font-family: Arial, sans-serif;
  font-size: 16px;
  color: #003c69;

  display: flex;
  justify-content: center;
  align-items: center;

  height: 100vh;
  margin: 0;
  text-align: center;
}

#countdowns {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.count-num {
  color: #c00000;
  font-weight: bold;
}
</style>

<body>
  <div id="countdowns">
    <div id="courtney"></div>
    <div id="drew"></div>
    <div id="michelle"></div>
    <div id="nick"></div>
  </div>

<script>
function minutesUntil(month, day) {
  const now = new Date();
  let year = now.getFullYear();

  let target = Date.UTC(year, month, day);

  if (now.getTime() > target) {
    target = Date.UTC(year + 1, month, day);
  }

  const diffMs = target - now.getTime();
  return Math.max(0, Math.floor(diffMs / 60000));
}

function update() {

  // Courtney — June 1 (5)
  const courtneyMinutes = minutesUntil(5, 1);

  // Drew — March 15 (2)
  const drewMinutes = minutesUntil(2, 15);

  // Michelle — March 1 (2)
  const michelleMinutes = minutesUntil(2, 1);

  // Nick — February 28 (1)
  const nickMinutes = minutesUntil(1, 28);

  document.getElementById("courtney").innerHTML =
    `<span class="count-num">${courtneyMinutes}</span> minutes until Courtney completes her next complete draft of Bad Energy.`;

  document.getElementById("drew").innerHTML =
    `<span class="count-num">${drewMinutes}</span> minutes until Drew shares 50,000 words of his novel-in-progress.`;

  document.getElementById("michelle").innerHTML =
    `<span class="count-num">${michelleMinutes}</span> minutes until Michelle completes her first draft of Merel's story.`;

  document.getElementById("nick").innerHTML =
    `<span class="count-num">${nickMinutes}</span> minutes until Nick sends everyone his final version of The Complex.`;
}

update();
setInterval(update, 1000);
</script>
</body>
