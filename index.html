<style>
body {
  font-family: Arial, sans-serif;
  font-size: 16px;
  color: #003c69;

  display: flex;
  justify-content: center;
  align-items: center;

  height: 100vh;
  margin: 0;
  text-align: center;

  /* neon sparkle cursor */
  cursor: none;
}

#countdowns {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.count-num {
  color: #c00000;
  font-weight: bold;
}

/* flashing Times Up */
.times-up {
  color: #8b0000;
  font-weight: bold;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* neon green sparkle dots */
.sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  pointer-events: none;
  background: #39ff14; /* neon green */
  box-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14;
  opacity: 1;
  transform: translate(-50%, -50%);
  animation: fadeOut 0.6s forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0);
  }
}
</style>

<body>
  <div id="countdowns"></div>

<script>
const writers = [
  {
    name: "Courtney",
    month: 5,
    day: 1,
    text: "completes her next complete draft of Bad Energy."
  },
  {
    name: "Drew",
    month: 2,
    day: 15,
    text: "shares 50,000 words of his novel-in-progress."
  },
  {
    name: "Michelle",
    month: 2,
    day: 1,
    text: "completes her first draft of Merel's story."
  },
  {
    name: "Nick",
    month: 1,
    day: 28,
    text: "sends everyone his final version of The Complex."
  }
];

function timeUntil(month, day) {
  const now = new Date();
  let year = now.getFullYear();

  let target = Date.UTC(year, month, day);

  if (now.getTime() > target) {
    target = Date.UTC(year + 1, month, day);
  }

  const diff = target - now.getTime();

  if (diff <= 0) {
    return { expired: true, ms: 0 };
  }

  const totalSeconds = Math.floor(diff / 1000);

  return {
    expired: false,
    ms: diff,
    days: Math.floor(totalSeconds / 86400),
    hours: Math.floor((totalSeconds % 86400) / 3600),
    minutes: Math.floor((totalSeconds % 3600) / 60)
  };
}

function update() {
  const container = document.getElementById("countdowns");

  const rows = writers.map(w => {
    const t = timeUntil(w.month, w.day);
    return { ...w, ...t };
  });

  // expired / soonest first
  rows.sort((a, b) => {
    if (a.expired && !b.expired) return -1;
    if (!a.expired && b.expired) return 1;
    return a.ms - b.ms;
  });

  container.innerHTML = "";

  rows.forEach(w => {
    const div = document.createElement("div");

    if (w.expired) {
      div.innerHTML = `<span class="times-up">Time’s up for ${w.name}…</span>`;
    } else {
      div.innerHTML =
        `<span class="count-num">${w.days}</span> days ` +
        `<span class="count-num">${w.hours}</span> hours ` +
        `<span class="count-num">${w.minutes}</span> minutes until ${w.name} ${w.text}`;
    }

    container.appendChild(div);
  });
}

update();
setInterval(update, 1000);

/* neon sparkle cursor trail */
document.addEventListener("mousemove", (e) => {
  const sparkle = document.createElement("div");
  sparkle.className = "sparkle";
  sparkle.style.left = e.clientX + "px";
  sparkle.style.top = e.clientY + "px";
  document.body.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), 600);
});
</script>
</body>
