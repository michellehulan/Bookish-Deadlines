<style>
body {
  font-family: Arial, sans-serif;
  font-size: 16px;
  color: #003c69;

  display: flex;
  justify-content: center;
  align-items: center;

  height: 100vh;
  margin: 0;
  text-align: center;

  /* hide system cursor so pencil replaces it */
  cursor: none;
}

#panel {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#countdowns {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.count-num {
  color: #c00000;
  font-weight: bold;
}

/* flashing Times Up */
.times-up {
  color: #8b0000;
  font-weight: bold;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* ---------- Arcade-Style Black Button (50% smaller) ---------- */
.emergency-btn {
  width: 46px;   /* was ~92px */
  height: 46px;  /* was ~92px */
  border-radius: 50%;

  background: radial-gradient(circle at 30% 30%, #444, #111);

  box-shadow:
    inset 0 3px 5px rgba(255,255,255,0.15),
    inset 0 -4px 7px rgba(0,0,0,0.8),
    0 5px 0 #050505,
    0 9px 14px rgba(0,0,0,0.6);

  margin: 8px auto 18px;
  display: block;

  transition: transform 120ms ease,
              box-shadow 120ms ease,
              filter 120ms ease;
}

.emergency-btn:active {
  transform: translateY(4px);

  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.12),
    inset 0 -2px 5px rgba(0,0,0,0.9),
    0 1px 0 #050505,
    0 4px 9px rgba(0,0,0,0.6);

  filter: brightness(0.95);
}

/* ---------- Pencil Cursor ---------- */
#wandCursor {
  position: fixed;
  width: 86px;
  height: 22px;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%) rotate(-15deg);
}

/* pencil body */
#wandCursor.pencil::before {
  content: "";
  position: absolute;
  left: 10px;
  top: 8px;
  width: 58px;
  height: 8px;
  background: linear-gradient(to right, #ffe066, #f1c40f);
  border-radius: 5px;
  box-shadow: 0 0 10px rgba(255, 224, 102, 0.35);
}

/* metal band */
#wandCursor.pencil::after {
  content: "";
  position: absolute;
  left: 68px;
  top: 8px;
  width: 8px;
  height: 8px;
  background: linear-gradient(#cfcfcf, #7a7a7a);
}

/* eraser */
#wandCursor .eraser {
  position: absolute;
  left: 76px;
  top: 7px;
  width: 12px;
  height: 10px;
  background: #ff8fb1;
  border-radius: 3px;
}

/* wooden tip */
#wandCursor .tip {
  position: absolute;
  left: 2px;
  top: 8px;
  width: 0;
  height: 0;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  border-right: 8px solid #d8b58a;
}

/* graphite lead */
#wandCursor .lead {
  position: absolute;
  left: 0px;
  top: 10px;
  width: 0;
  height: 0;
  border-top: 2px solid transparent;
  border-bottom: 2px solid transparent;
  border-right: 4px solid #333;
}

/* hand state when hovering button */
#wandCursor.hand {
  width: 28px;
  height: 28px;
  transform: translate(-50%, -50%);
}

#wandCursor.hand::before {
  content: "☞";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -55%);
  font-size: 26px;
  color: #003c69;
  text-shadow: 0 0 10px rgba(255, 224, 102, 0.45);
}

#wandCursor.hand::after {
  content: "";
}

/* ---------- Yellow Sparkle Particles ---------- */
.sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  pointer-events: none;
  background: #ffe066;
  box-shadow: 0 0 10px #ffe066, 0 0 18px rgba(255, 224, 102, 0.9);
  opacity: 1;
  transform: translate(-50%, -50%);
  animation: fadeOut 0.75s forwards;
  z-index: 9998;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0);
  }
}
</style>

<body>
  <div id="panel">
    <div id="countdowns"></div>
  </div>

  <!-- pencil cursor -->
  <div id="wandCursor" class="pencil">
    <div class="tip"></div>
    <div class="lead"></div>
    <div class="eraser"></div>
  </div>

<script>
const writers = [
  {
    name: "Courtney",
    month: 5,
    day: 1,
    text: "completes her next complete draft of Bad Energy.",
    hasButton: true
  },
  {
    name: "Drew",
    month: 2,
    day: 15,
    text: "shares 50,000 words of his novel-in-progress."
  },
  {
    name: "Michelle",
    month: 2,
    day: 1,
    text: "completes her first draft of Merel's story."
  },
  {
    name: "Nick",
    month: 1,
    day: 28,
    text: "sends everyone his final version of The Complex."
  }
];

const YOUTUBE_LINK = "YOUR_YOUTUBE_LINK_HERE";

function timeUntil(month, day) {
  const now = new Date();
  const year = now.getFullYear();

  let target = Date.UTC(year, month, day);

  if (now.getTime() > target) {
    target = Date.UTC(year + 1, month, day);
  }

  const diff = target - now.getTime();

  if (diff <= 0) {
    return { expired: true, ms: 0 };
  }

  const totalSeconds = Math.floor(diff / 1000);

  return {
    expired: false,
    ms: diff,
    days: Math.floor(totalSeconds / 86400),
    hours: Math.floor((totalSeconds % 86400) / 3600),
    minutes: Math.floor((totalSeconds % 3600) / 60)
  };
}

function update() {
  const container = document.getElementById("countdowns");

  const rows = writers.map(w => {
    const t = timeUntil(w.month, w.day);
    return { ...w, ...t };
  });

  // expired first, then shortest remaining time first
  rows.sort((a, b) => {
    if (a.expired && !b.expired) return -1;
    if (!a.expired && b.expired) return 1;
    return a.ms - b.ms;
  });

  container.innerHTML = "";

  rows.forEach(w => {
    const div = document.createElement("div");

    if (w.expired) {
      div.innerHTML = `<span class="times-up">Time’s up for ${w.name}…</span>`;
    } else {
      div.innerHTML =
        `<span class="count-num">${w.days}</span> days ` +
        `<span class="count-num">${w.hours}</span> hours ` +
        `<span class="count-num">${w.minutes}</span> minutes until ${w.name} ${w.text}`;
    }

    container.appendChild(div);

    // insert the mystery arcade button after Courtney's line (wherever she sorts)
    if (w.hasButton) {
      const btn = document.createElement("a");
      btn.className = "emergency-btn";
      btn.href = YOUTUBE_LINK;
      btn.target = "_blank";
      btn.rel = "noopener noreferrer";
      btn.setAttribute("aria-label", "Emergency Motivation Video");
      btn.setAttribute("title", "Emergency Motivation Video");
      container.appendChild(btn);
    }
  });
}

update();
setInterval(update, 1000);

/* ---------- Pencil cursor + yellow sparkles ---------- */
const pencil = document.getElementById("wandCursor");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let cursorX = mouseX;
let cursorY = mouseY;

// smooth follow
function animateCursor() {
  cursorX += (mouseX - cursorX) * 0.25;
  cursorY += (mouseY - cursorY) * 0.25;
  pencil.style.left = cursorX + "px";
  pencil.style.top = cursorY + "px";
  requestAnimationFrame(animateCursor);
}
animateCursor();

// sparkle trail (heavier)
document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  for (let i = 0; i < 5; i++) {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";

    const offsetX = (Math.random() - 0.5) * 22;
    const offsetY = (Math.random() - 0.5) * 22;

    const size = 4 + Math.random() * 6; // 4–10px
    sparkle.style.width = size + "px";
    sparkle.style.height = size + "px";

    sparkle.style.left = (e.clientX + offsetX) + "px";
    sparkle.style.top = (e.clientY + offsetY) + "px";

    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 750);
  }
});

// swap to hand when hovering over the button
document.addEventListener("mouseover", (e) => {
  if (e.target.classList.contains("emergency-btn")) {
    pencil.classList.remove("pencil");
    pencil.classList.add("hand");
  }
});

document.addEventListener("mouseout", (e) => {
  if (e.target.classList.contains("emergency-btn")) {
    pencil.classList.remove("hand");
    pencil.classList.add("pencil");
  }
});
</script>
</body>
