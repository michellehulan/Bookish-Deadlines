<style>
body {
  font-family: Arial, sans-serif;
  font-size: 14px;
  color: #003c69;

  display: flex;
  justify-content: flex-start;
  align-items: center;

  height: 100vh;
  margin: 0;
  padding-left: 10px;
  text-align: left;
}

#countdown {
  white-space: normal;
}

/* red + bold numbers */
.count-num {
  color: #c00000;
  font-weight: bold;
}
</style>

<body>
  <div id="countdown"></div>

<script>
function update() {
  const now = new Date();

  let targetYear = now.getFullYear();

  // March 15 at UTC midnight
  let targetUTC = Date.UTC(targetYear, 2, 15);

  // If already passed, use next year
  if (now.getTime() > targetUTC) {
    targetYear++;
    targetUTC = Date.UTC(targetYear, 2, 15);
  }

  const diff = targetUTC - now.getTime();

  const totalSeconds = Math.max(0, Math.floor(diff / 1000));

  const days = Math.floor(totalSeconds / 86400);
  const hours = Math.floor((totalSeconds % 86400) / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);

  document.getElementById("countdown").innerHTML =
    `<span class="count-num">${days}</span> days ` +
    `<span class="count-num">${hours}</span> hours ` +
    `<span class="count-num">${minutes}</span> minutes until Drew shares 50,000 words of his novel-in-progress....`;
}

update();
setInterval(update, 1000);
</script>
</body>
