<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: Arial, sans-serif;
  font-size: 16px;
  color: #003c69;

  display: flex;
  justify-content: center;
  align-items: center;

  height: 100vh;
  margin: 0;
  text-align: center;

  cursor: none;
}

/* layout */
#panel {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#countdowns {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.count-num {
  color: #c00000;
  font-weight: bold;
}

/* flashing Times Up */
.times-up {
  color: #8b0000;
  font-weight: bold;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* ---------- Arcade Button (50% smaller) ---------- */
.emergency-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #444, #111);

  box-shadow:
    inset 0 3px 5px rgba(255,255,255,0.15),
    inset 0 -4px 7px rgba(0,0,0,0.8),
    0 5px 0 #050505,
    0 9px 14px rgba(0,0,0,0.6);

  margin: 6px auto 16px;
  display: block;

  transition: transform 120ms ease,
              box-shadow 120ms ease,
              filter 120ms ease;
}

.emergency-btn:active {
  transform: translateY(4px);
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,0.12),
    inset 0 -2px 5px rgba(0,0,0,0.9),
    0 1px 0 #050505,
    0 4px 9px rgba(0,0,0,0.6);

  filter: brightness(0.95);
}

/* ---------- Pencil Cursor ---------- */
#wandCursor {
  position: fixed;
  width: 86px;
  height: 22px;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%) rotate(-15deg);
}

#wandCursor.pencil::before {
  content: "";
  position: absolute;
  left: 10px;
  top: 8px;
  width: 58px;
  height: 8px;
  background: linear-gradient(to right, #ffe066, #f1c40f);
  border-radius: 5px;
}

#wandCursor.pencil::after {
  content: "";
  position: absolute;
  left: 68px;
  top: 8px;
  width: 8px;
  height: 8px;
  background: linear-gradient(#cfcfcf, #7a7a7a);
}

#wandCursor .eraser {
  position: absolute;
  left: 76px;
  top: 7px;
  width: 12px;
  height: 10px;
  background: #ff8fb1;
  border-radius: 3px;
}

#wandCursor .tip {
  position: absolute;
  left: 2px;
  top: 8px;
  width: 0;
  height: 0;
  border-top: 4px solid transparent;
  border-bottom: 4px solid transparent;
  border-right: 8px solid #d8b58a;
}

#wandCursor .lead {
  position: absolute;
  left: 0px;
  top: 10px;
  width: 0;
  height: 0;
  border-top: 2px solid transparent;
  border-bottom: 2px solid transparent;
  border-right: 4px solid #333;
}

#wandCursor.hand {
  width: 28px;
  height: 28px;
  transform: translate(-50%, -50%);
}

#wandCursor.hand::before {
  content: "☞";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -55%);
  font-size: 26px;
  color: #003c69;
}

#wandCursor.hand::after { content: ""; }

/* ---------- Sparkles ---------- */
.sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  pointer-events: none;
  background: #ffe066;
  box-shadow: 0 0 10px #ffe066;
  animation: fadeOut 0.75s forwards;
  z-index: 9998;
}

@keyframes fadeOut {
  to { opacity: 0; transform: scale(0); }
}

/* ---------- Drawing Canvas ---------- */
#drawLayer {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

#panel { position: relative; z-index: 2; }
</style>
</head>

<body>

<canvas id="drawLayer"></canvas>

<div id="panel">
  <div id="countdowns"></div>
</div>

<div id="wandCursor" class="pencil">
  <div class="tip"></div>
  <div class="lead"></div>
  <div class="eraser"></div>
</div>

<script>
/* ---------- Countdown Data ---------- */
const writers = [
  {
    name: "Courtney",
    month: 5,
    day: 1,
    text: "completes her next complete draft of Bad Energy.",
    hasButton: true
  },
  {
    name: "Drew",
    month: 2,
    day: 15,
    text: "shares 50,000 words of his novel-in-progress."
  },
  {
    name: "Michelle",
    month: 2,
    day: 1,
    text: "completes her first draft of Merel's story."
  },
  {
    name: "Nick",
    month: 1,
    day: 28,
    text: "sends everyone his final version of The Complex."
  }
];

const YOUTUBE_LINK = "https://www.youtube.com/watch?v=CMs6PELL5DU";

/* ---------- Countdown Logic ---------- */
function timeUntil(month, day) {
  const now = new Date();
  let year = now.getFullYear();

  let target = Date.UTC(year, month, day);
  if (now.getTime() > target) target = Date.UTC(year + 1, month, day);

  const diff = target - now.getTime();

  if (diff <= 0) return { expired: true, ms: 0 };

  const totalSeconds = Math.floor(diff / 1000);

  return {
    expired: false,
    ms: diff,
    days: Math.floor(totalSeconds / 86400),
    hours: Math.floor((totalSeconds % 86400) / 3600),
    minutes: Math.floor((totalSeconds % 3600) / 60)
  };
}

function update() {
  const container = document.getElementById("countdowns");

  const rows = writers.map(w => ({ ...w, ...timeUntil(w.month, w.day) }));

  rows.sort((a,b)=>{
    if (a.expired && !b.expired) return -1;
    if (!a.expired && b.expired) return 1;
    return a.ms - b.ms;
  });

  container.innerHTML = "";

  rows.forEach(w => {
    const div = document.createElement("div");

    if (w.expired) {
      div.innerHTML = `<span class="times-up">Time’s up for ${w.name}…</span>`;
    } else {
      div.innerHTML =
        `<span class="count-num">${w.days}</span> days ` +
        `<span class="count-num">${w.hours}</span> hours ` +
        `<span class="count-num">${w.minutes}</span> minutes until ${w.name} ${w.text}`;
    }

    container.appendChild(div);

    if (w.hasButton) {
      const btn = document.createElement("a");
      btn.className = "emergency-btn";
      btn.href = YOUTUBE_LINK;
      btn.target = "_blank";
      container.appendChild(btn);
    }
  });
}

update();
setInterval(update, 1000);

/* ---------- Pencil Cursor + Sparkles ---------- */
const pencil = document.getElementById("wandCursor");

let mouseX = innerWidth/2, mouseY = innerHeight/2;
let cx = mouseX, cy = mouseY;

function animateCursor(){
  cx += (mouseX - cx)*0.25;
  cy += (mouseY - cy)*0.25;
  pencil.style.left = cx+"px";
  pencil.style.top = cy+"px";
  requestAnimationFrame(animateCursor);
}
animateCursor();

document.addEventListener("mousemove", e=>{
  mouseX=e.clientX; mouseY=e.clientY;

  for(let i=0;i<4;i++){
    const s=document.createElement("div");
    s.className="sparkle";
    s.style.left=(e.clientX+(Math.random()-.5)*20)+"px";
    s.style.top=(e.clientY+(Math.random()-.5)*20)+"px";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),700);
  }
});

/* ---------- Button Hover Cursor ---------- */
document.addEventListener("mouseover", e=>{
  if(e.target.classList.contains("emergency-btn")){
    pencil.classList.remove("pencil");
    pencil.classList.add("hand");
  }
});
document.addEventListener("mouseout", e=>{
  if(e.target.classList.contains("emergency-btn")){
    pencil.classList.remove("hand");
    pencil.classList.add("pencil");
  }
});

/* ---------- Writing Canvas ---------- */
const phrase = "all work no play makes jack a dull boy ";
const canvas=document.getElementById("drawLayer");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
  const dpr=devicePixelRatio||1;
  canvas.width=innerWidth*dpr;
  canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.font="16px Arial";
  ctx.fillStyle="rgba(30,30,30,.55)";
}
resizeCanvas();
addEventListener("resize",resizeCanvas);

let writing=false,lastX=0,lastY=0,charIndex=0,distAcc=0;
const stepPx=8;

addEventListener("mousedown",e=>{
  writing=true;
  lastX=e.clientX;
  lastY=e.clientY;
  distAcc=0;
});

addEventListener("mouseup",()=>writing=false);
addEventListener("mouseleave",()=>writing=false);

addEventListener("mousemove",e=>{
  if(!writing) return;

  const dx=e.clientX-lastX;
  const dy=e.clientY-lastY;
  const len=Math.hypot(dx,dy);
  const angle=Math.atan2(dy,dx);

  let traveled=0;
  while(distAcc+(len-traveled)>=stepPx){
    const step=stepPx-distAcc;
    traveled+=step;
    const t=traveled/len;

    ctx.save();
    ctx.translate(lastX+dx*t,lastY+dy*t);
    ctx.rotate(angle);
    ctx.fillText(phrase[charIndex++%phrase.length],0,0);
    ctx.restore();

    distAcc=0;
  }

  distAcc+=len-traveled;
  lastX=e.clientX;
  lastY=e.clientY;
});

// press C to clear
addEventListener("keydown",e=>{
  if(e.key.toLowerCase()==="c"){
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }
});
</script>

</body>
</html>
