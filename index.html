<style>
body {
  font-family: Arial, sans-serif;
  font-size: 16px;
  color: #003c69;

  display: flex;
  justify-content: center;
  align-items: center;

  height: 100vh;
  margin: 0;
  text-align: center;

  cursor: none;
}

/* layout */
#panel {
  display: flex;
  flex-direction: column;
  align-items: center;
}

#countdowns {
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.count-num {
  color: #c00000;
  font-weight: bold;
}

/* flashing Times Up */
.times-up {
  color: #8b0000;
  font-weight: bold;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

/* ---------- Emergency Button (Round) ---------- */
.emergency-btn {
  width: 90px;
  height: 90px;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, #ff5a5a, #b40000);

  box-shadow:
    inset 0 6px 12px rgba(255,255,255,0.25),
    inset 0 -6px 12px rgba(0,0,0,0.25),
    0 10px 0 #6f0000,
    0 18px 30px rgba(0,0,0,0.3);

  margin: 8px auto 18px;
  display: block;

  transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
}

.emergency-btn:active {
  transform: translateY(8px);
  box-shadow:
    inset 0 3px 6px rgba(255,255,255,0.2),
    inset 0 -3px 6px rgba(0,0,0,0.3),
    0 2px 0 #6f0000,
    0 8px 18px rgba(0,0,0,0.25);
  filter: brightness(0.95);
}

/* ---------- Wand Cursor ---------- */
#wandCursor {
  position: fixed;
  width: 24px;
  height: 24px;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
}

/* wand state */
#wandCursor.wand::before {
  content: "";
  position: absolute;
  left: 9px;
  top: 6px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #39ff14;
  box-shadow: 0 0 10px #39ff14, 0 0 22px #39ff14;
}

#wandCursor.wand::after {
  content: "";
  position: absolute;
  left: 6px;
  top: 13px;
  width: 14px;
  height: 3px;
  background: rgba(0,60,105,0.55);
  border-radius: 999px;
  transform: rotate(-35deg);
}

/* hand state */
#wandCursor.hand::before {
  content: "☞";
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -55%);
  font-size: 22px;
  color: #003c69;
  text-shadow: 0 0 10px rgba(57,255,20,0.4);
}

#wandCursor.hand::after {
  content: "";
}

/* sparkle particles */
.sparkle {
  position: fixed;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  pointer-events: none;
  background: #39ff14;
  box-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14;
  animation: fadeOut 0.7s forwards;
  z-index: 9998;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    transform: scale(0);
  }
}
</style>

<body>
  <div id="panel">
    <div id="countdowns"></div>
  </div>

  <!-- wand cursor -->
  <div id="wandCursor" class="wand"></div>

<script>
const writers = [
  {
    name: "Courtney",
    month: 5,
    day: 1,
    text: "completes her next complete draft of Bad Energy.",
    hasButton: true
  },
  {
    name: "Drew",
    month: 2,
    day: 15,
    text: "shares 50,000 words of his novel-in-progress."
  },
  {
    name: "Michelle",
    month: 2,
    day: 1,
    text: "completes her first draft of Merel's story."
  },
  {
    name: "Nick",
    month: 1,
    day: 28,
    text: "sends everyone his final version of The Complex."
  }
];

const YOUTUBE_LINK = "https://www.youtube.com/watch?v=CMs6PELL5DU";

function timeUntil(month, day) {
  const now = new Date();
  let year = now.getFullYear();

  let target = Date.UTC(year, month, day);

  if (now.getTime() > target) {
    target = Date.UTC(year + 1, month, day);
  }

  const diff = target - now.getTime();

  if (diff <= 0) {
    return { expired: true, ms: 0 };
  }

  const totalSeconds = Math.floor(diff / 1000);

  return {
    expired: false,
    ms: diff,
    days: Math.floor(totalSeconds / 86400),
    hours: Math.floor((totalSeconds % 86400) / 3600),
    minutes: Math.floor((totalSeconds % 3600) / 60)
  };
}

function update() {
  const container = document.getElementById("countdowns");

  const rows = writers.map(w => {
    const t = timeUntil(w.month, w.day);
    return { ...w, ...t };
  });

  rows.sort((a, b) => {
    if (a.expired && !b.expired) return -1;
    if (!a.expired && b.expired) return 1;
    return a.ms - b.ms;
  });

  container.innerHTML = "";

  rows.forEach(w => {
    const div = document.createElement("div");

    if (w.expired) {
      div.innerHTML = `<span class="times-up">Time’s up for ${w.name}…</span>`;
    } else {
      div.innerHTML =
        `<span class="count-num">${w.days}</span> days ` +
        `<span class="count-num">${w.hours}</span> hours ` +
        `<span class="count-num">${w.minutes}</span> minutes until ${w.name} ${w.text}`;
    }

    container.appendChild(div);

    /* insert the mystery button after Courtney */
    if (w.hasButton) {
      const btn = document.createElement("a");
      btn.className = "emergency-btn";
      btn.href = YOUTUBE_LINK;
      btn.target = "_blank";
      btn.id = "emergencyBtn";

      container.appendChild(btn);
    }
  });
}

update();
setInterval(update, 1000);

/* ---------- Wand + Sparkles ---------- */
const wand = document.getElementById("wandCursor");

let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let wandX = mouseX;
let wandY = mouseY;

function animateWand() {
  wandX += (mouseX - wandX) * 0.25;
  wandY += (mouseY - wandY) * 0.25;
  wand.style.left = wandX + "px";
  wand.style.top = wandY + "px";
  requestAnimationFrame(animateWand);
}
animateWand();

document.addEventListener("mousemove", (e) => {
  mouseX = e.clientX;
  mouseY = e.clientY;

  for (let i = 0; i < 4; i++) {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";

    const offsetX = (Math.random() - 0.5) * 18;
    const offsetY = (Math.random() - 0.5) * 18;

    const size = 4 + Math.random() * 5;
    sparkle.style.width = size + "px";
    sparkle.style.height = size + "px";

    sparkle.style.left = (e.clientX + offsetX) + "px";
    sparkle.style.top = (e.clientY + offsetY) + "px";

    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 700);
  }
});

/* hover hand when over button */
document.addEventListener("mouseover", (e) => {
  if (e.target.classList.contains("emergency-btn")) {
    wand.classList.remove("wand");
    wand.classList.add("hand");
  }
});

document.addEventListener("mouseout", (e) => {
  if (e.target.classList.contains("emergency-btn")) {
    wand.classList.remove("hand");
    wand.classList.add("wand");
  }
});
</script>
</body>
